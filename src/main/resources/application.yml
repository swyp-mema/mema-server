server:
  port: 8080

spring:
  profiles:
    active: dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NAVER_EMAIL}
    password: ${NAVER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

api:
  info:
    key: ${API_KEY}
  time:
    key: ${API_TIME_KEY}
  master:
    key: ${API_MASTER_KEY}